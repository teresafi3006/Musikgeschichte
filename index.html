    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // 1. WEB AUDIO API SYNTHESIZER (NATIV IM BROWSER)
    // ==========================================
    class AudioSynthesizerEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.activeNodes = [];
      }

      initContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      stopAll() {
        this.isPlaying = false;
        this.activeNodes.forEach(node => {
          try {
            if ('stop' in node) node.stop();
            node.disconnect();
          } catch (e) {}
        });
        this.activeNodes = [];
      }

      noteToFreq(note) {
        const notes = {
          'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00,
          'G3': 196.00, 'Ab3': 207.65, 'A3': 220.00, 'Bb3': 233.08, 'B3': 246.94,
          'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23,
          'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'Ab4': 415.30, 'A4': 440.00, 'Bb4': 466.16,
          'B4': 493.88, 'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99
        };
        return notes[note] || 440;
      }

      // Gregorianischer Choral (Dorisch)
      playGregorianChant(onComplete) {
        this.stopAll();
        this.initContext();
        if (!this.ctx) return;
        const ctx = this.ctx;
        this.isPlaying = true;

        const melody = [
          { note: 'D4', dur: 0.8 }, { note: 'F4', dur: 0.6 }, { note: 'G4', dur: 0.7 },
          { note: 'A4', dur: 1.0 }, { note: 'C5', dur: 0.6 }, { note: 'B4', dur: 0.5 },
          { note: 'A4', dur: 0.8 }, { note: 'G4', dur: 0.7 }, { note: 'F4', dur: 0.6 },
          { note: 'E4', dur: 0.7 }, { note: 'D4', dur: 1.6 },
        ];

        // Orgel/Bordun Drone
        const droneOsc = ctx.createOscillator();
        const droneGain = ctx.createGain();
        droneOsc.type = 'triangle';
        droneOsc.frequency.setValueAtTime(this.noteToFreq('D3'), ctx.currentTime);
        droneGain.gain.setValueAtTime(0.08, ctx.currentTime);
        droneGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 10);
        droneOsc.connect(droneGain);
        droneGain.connect(ctx.destination);
        droneOsc.start();
        droneOsc.stop(ctx.currentTime + 10);
        this.activeNodes.push(droneOsc, droneGain);

        let time = ctx.currentTime + 0.1;
        for (const item of melody) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(700, time);
          filter.Q.setValueAtTime(2.5, time);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(this.noteToFreq(item.note), time);

          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.25, time + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, time + item.dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(time);
          osc.stop(time + item.dur);
          this.activeNodes.push(osc, gain);
          time += item.dur * 0.9;
        }

        setTimeout(() => {
          if (this.isPlaying) {
            this.isPlaying = false;
            onComplete && onComplete();
          }
        }, Math.max(100, (time - ctx.currentTime) * 1000));
      }

      // Barock: Basso Continuo & Quintfallsequenz (Cembalo-Klangfarbe)
      playBaroqueContinuo(onComplete) {
        this.stopAll();
        this.initContext();
        if (!this.ctx) return;
        const ctx = this.ctx;
        this.isPlaying = true;

        const sequence = [
          { bass: 'A3', treble: ['C5', 'E5', 'A5'], dur: 0.8 },
          { bass: 'D3', treble: ['D5', 'F5', 'A5'], dur: 0.8 },
          { bass: 'G3', treble: ['B4', 'D5', 'G5'], dur: 0.8 },
          { bass: 'C3', treble: ['C5', 'E5', 'G5'], dur: 0.8 },
          { bass: 'F3', treble: ['A4', 'C5', 'F5'], dur: 0.8 },
          { bass: 'B3', treble: ['G#4', 'D5', 'F5'], dur: 0.8 },
          { bass: 'E3', treble: ['G#4', 'B4', 'E5'], dur: 1.0 },
          { bass: 'A3', treble: ['A4', 'C5', 'E5'], dur: 1.5 },
        ];

        let time = ctx.currentTime + 0.1;
        for (const step of sequence) {
          const bassOsc = ctx.createOscillator();
          const bassGain = ctx.createGain();
          bassOsc.type = 'sawtooth';
          bassOsc.frequency.setValueAtTime(this.noteToFreq(step.bass), time);
          bassGain.gain.setValueAtTime(0.18, time);
          bassGain.gain.exponentialRampToValueAtTime(0.001, time + step.dur * 0.9);
          bassOsc.connect(bassGain);
          bassGain.connect(ctx.destination);
          bassOsc.start(time);
          bassOsc.stop(time + step.dur);
          this.activeNodes.push(bassOsc, bassGain);

          step.treble.forEach((tNote, idx) => {
            const arpeggioDelay = idx * 0.04;
            const harpsOsc = ctx.createOscillator();
            const harpsGain = ctx.createGain();
            harpsOsc.type = 'square';
            harpsOsc.frequency.setValueAtTime(this.noteToFreq(tNote), time + arpeggioDelay);

            harpsGain.gain.setValueAtTime(0.09, time + arpeggioDelay);
            harpsGain.gain.exponentialRampToValueAtTime(0.001, time + arpeggioDelay + 0.6);

            harpsOsc.connect(harpsGain);
            harpsGain.connect(ctx.destination);
            harpsOsc.start(time + arpeggioDelay);
            harpsOsc.stop(time + arpeggioDelay + 0.6);
            this.activeNodes.push(harpsOsc, harpsGain);
          });
          time += step.dur;
        }

        setTimeout(() => {
          if (this.isPlaying) {
            this.isPlaying = false;
            onComplete && onComplete();
          }
        }, Math.max(100, (time - ctx.currentTime) * 1000));
      }

      // Wiener Klassik: Sonatenhauptthema mit Alberti-Bässen
      playClassicalSonata(onComplete) {
        this.stopAll();
        this.initContext();
        if (!this.ctx) return;
        const ctx = this.ctx;
        this.isPlaying = true;

        const melody = [
          { note: 'C5', time: 0, dur: 1.0 }, { note: 'E5', time: 1.0, dur: 0.5 },
          { note: 'G5', time: 1.5, dur: 0.5 }, { note: 'B4', time: 2.0, dur: 0.75 },
          { note: 'C5', time: 2.75, dur: 0.25 }, { note: 'D5', time: 3.0, dur: 0.5 },
          { note: 'C5', time: 3.5, dur: 1.0 }, { note: 'A4', time: 4.5, dur: 0.5 },
          { note: 'F5', time: 5.0, dur: 0.5 }, { note: 'D5', time: 5.5, dur: 0.5 },
          { note: 'B4', time: 6.0, dur: 0.5 }, { note: 'C5', time: 6.5, dur: 1.5 },
        ];

        const albertiNotes = [
          'C3', 'G3', 'E3', 'G3', 'C3', 'G3', 'E3', 'G3',
          'C3', 'G3', 'E3', 'G3', 'C3', 'G3', 'E3', 'G3',
          'F3', 'C4', 'A3', 'C4', 'G3', 'D4', 'B3', 'D4',
          'C3', 'G3', 'E3', 'G3', 'C3'
        ];

        const startTime = ctx.currentTime + 0.1;
        for (const item of melody) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(this.noteToFreq(item.note), startTime + item.time);
          gain.gain.setValueAtTime(0.18, startTime + item.time);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + item.time + item.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime + item.time);
          osc.stop(startTime + item.time + item.dur);
          this.activeNodes.push(osc, gain);
        }

        let bTime = 0;
        for (const note of albertiNotes) {
          const bOsc = ctx.createOscillator();
          const bGain = ctx.createGain();
          bOsc.type = 'sine';
          bOsc.frequency.setValueAtTime(this.noteToFreq(note), startTime + bTime);
          bGain.gain.setValueAtTime(0.08, startTime + bTime);
          bGain.gain.exponentialRampToValueAtTime(0.001, startTime + bTime + 0.28);
          bOsc.connect(bGain);
          bGain.connect(ctx.destination);
          bOsc.start(startTime + bTime);
          bOsc.stop(startTime + bTime + 0.28);
          this.activeNodes.push(bOsc, bGain);
          bTime += 0.28;
        }

        setTimeout(() => {
          if (this.isPlaying) {
            this.isPlaying = false;
            onComplete && onComplete();
          }
        }, 8500);
      }

      // Romantik: Der Tristan-Akkord (F - H - D# - G#)
      playRomanticTristan(onComplete) {
        this.stopAll();
        this.initContext();
        if (!this.ctx) return;
        const ctx = this.ctx;
        this.isPlaying = true;
        const startTime = ctx.currentTime + 0.1;

        // Cello Auftakt
        const upbeat = [
          { note: 'A3', time: 0, dur: 1.0 },
          { note: 'F3', time: 1.0, dur: 0.8 },
          { note: 'E3', time: 1.8, dur: 0.8 },
        ];
        upbeat.forEach(u => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(this.noteToFreq(u.note), startTime + u.time);
          gain.gain.setValueAtTime(0.12, startTime + u.time);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + u.time + u.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime + u.time);
          osc.stop(startTime + u.time + u.dur);
          this.activeNodes.push(osc, gain);
        });

        // Tristan-Akkord F3 + B3 + D#4 + G#4
        ['F3', 'B3', 'D#4', 'G#4'].forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(this.noteToFreq(note), startTime + 2.8);
          gain.gain.setValueAtTime(0.14, startTime + 2.8);
          gain.gain.exponentialRampToValueAtTime(0.005, startTime + 5.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime + 2.8);
          osc.stop(startTime + 5.5);
          this.activeNodes.push(osc, gain);
        });

        // Chromatische Seufzerauflösung G# -> A
        const sighOsc = ctx.createOscillator();
        const sighGain = ctx.createGain();
        sighOsc.type = 'triangle';
        sighOsc.frequency.setValueAtTime(this.noteToFreq('A4'), startTime + 4.2);
        sighGain.gain.setValueAtTime(0.16, startTime + 4.2);
        sighGain.gain.exponentialRampToValueAtTime(0.001, startTime + 5.6);
        sighOsc.connect(sighGain);
        sighGain.connect(ctx.destination);
        sighOsc.start(startTime + 4.2);
        sighOsc.stop(startTime + 5.6);
        this.activeNodes.push(sighOsc, sighGain);

        // Auflösung nach E7 Dominante
        ['E3', 'G#3', 'D4', 'E4'].forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(this.noteToFreq(note), startTime + 5.6);
          gain.gain.setValueAtTime(0.15, startTime + 5.6);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 9.0);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime + 5.6);
          osc.stop(startTime + 9.0);
          this.activeNodes.push(osc, gain);
        });

        setTimeout(() => {
          if (this.isPlaying) {
            this.isPlaying = false;
            onComplete && onComplete();
          }
        }, 9500);
      }

      // Moderne: Arnold Schönberg 12-Ton-Reihe
      playTwelveToneRow(rowType, onComplete) {
        this.stopAll();
        this.initContext();
        if (!this.ctx) return;
        const ctx = this.ctx;
        this.isPlaying = true;

        const originalNotes = ['C4', 'C#4', 'E4', 'D#4', 'G4', 'F#4', 'F4', 'A4', 'Ab4', 'Bb4', 'B4', 'D4'];
        let sequence = [...originalNotes];
        if (rowType === 'retrograde') sequence = [...originalNotes].reverse();
        else if (rowType === 'inversion') sequence = ['C4', 'B3', 'Ab3', 'A3', 'F3', 'F#3', 'G3', 'Eb3', 'E3', 'D3', 'C#3', 'Bb3'];
        else if (rowType === 'retrogradeInversion') sequence = ['C4', 'B3', 'Ab3', 'A3', 'F3', 'F#3', 'G3', 'Eb3', 'E3', 'D3', 'C#3', 'Bb3'].reverse();

        const startTime = ctx.currentTime + 0.1;
        let time = startTime;
        sequence.forEach((note, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(this.noteToFreq(note), time);
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.2, time + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time);
          osc.stop(time + 0.55);
          this.activeNodes.push(osc, gain);
          time += 0.55;
        });

        setTimeout(() => {
          if (this.isPlaying) {
            this.isPlaying = false;
            onComplete && onComplete();
          }
        }, Math.max(100, (time - ctx.currentTime) * 1000));
      }
    }

    const audioSynth = new AudioSynthesizerEngine();

      const [activeTab, setActiveTab] = useState('timeline');

      // Quiz State
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [quizCompleted, setQuizCompleted] = useState(false);
      const [hasRevealedAnswer, setHasRevealedAnswer] = useState(false);

      // Glossar State
      const [searchQuery, setSearchQuery] = useState('');
      const [glossaryCategory, setGlossaryCategory] = useState('all');
      const [selectedTerm, setSelectedTerm] = useState(null);

      // Klang- & Formlabor State
      const [sonataStage, setSonataStage] = useState('expo');
      const [twelveToneMode, setTwelveToneMode] = useState('original');

      // Audio Trigger Helper
      const handlePlayAudio = (audioId) => {
        if (playingAudioId === audioId) {
          audioSynth.stopAll();
          setPlayingAudioId(null);
          return;
        }
        setPlayingAudioId(audioId);
        const onEnd = () => setPlayingAudioId(null);

        switch (audioId) {
          case 'gregorian': audioSynth.playGregorianChant(onEnd); break;
          case 'baroque': audioSynth.playBaroqueContinuo(onEnd); break;
          case 'classic': audioSynth.playClassicalSonata(onEnd); break;
          case 'romantic': audioSynth.playRomanticTristan(onEnd); break;
          case 'modern': audioSynth.playTwelveToneRow(twelveToneMode, onEnd); break;
          default: audioSynth.stopAll(); setPlayingAudioId(null);
        }
      };

      // Quiz Handlers
      const currentQ = EXAM_QUESTIONS[quizIndex];
      const isCorrect = selectedAnswers[currentQ?.id] === currentQ?.correctIndex;
      const score = Object.keys(selectedAnswers).reduce((acc, qId) => {
        const q = EXAM_QUESTIONS.find(item => item.id === qId);
        return acc + (q && selectedAnswers[qId] === q.correctIndex ? 1 : 0);
      }, 0);
      const percentage = Math.round((score / EXAM_QUESTIONS.length) * 100);

      const handleSelectOption = (idx) => {
        if (hasRevealedAnswer) return;
        setSelectedAnswers(prev => ({ ...prev, [currentQ.id]: idx }));
        setHasRevealedAnswer(true);
      };

      const handleNextQuestion = () => {
        if (quizIndex < EXAM_QUESTIONS.length - 1) {
          setQuizIndex(prev => prev + 1);
          setHasRevealedAnswer(false);
        } else {
          setQuizCompleted(true);
        }
      };

      const handleResetQuiz = () => {
        setQuizIndex(0);
        setSelectedAnswers({});
        setQuizCompleted(false);
        setHasRevealedAnswer(false);
      };

      // Glossar Filter

        return GLOSSARY_TERMS.filter(item => {
          const matchesCat = glossaryCategory === 'all' || item.category === glossaryCategory;
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || item.term.toLowerCase().includes(q) || item.definition.toLowerCase().includes(q) || item.epoch.toLowerCase().includes(q);

        }).sort((a, b) => a.term.localeCompare(b.term, 'de'));
      }, [searchQuery, glossaryCategory]);

                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-800/40">
                        {currentQ.category}
                      </span>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-stone-800 text-stone-300">
                        Epoche: {currentQ.epoch}
                      </span>
                    </div>

                    {/* Frage */}
                    <h3 className="font-serif text-xl sm:text-2xl font-bold text-stone-100 leading-snug">
                      {currentQ.question}
                    </h3>

                    {/* Antwort-Optionen */}
                    <div className="grid grid-cols-1 gap-3 pt-2">
                      {currentQ.options.map((opt, idx) => {
                        const isChosen = selectedAnswers[currentQ.id] === idx;
                        const isAnswerCorrect = idx === currentQ.correctIndex;

                        let style = 'bg-stone-850 border-stone-800 hover:border-stone-700 text-stone-200';
                        if (hasRevealedAnswer) {
                          if (isAnswerCorrect) style = 'bg-emerald-950/60 border-emerald-500 text-emerald-100 ring-1 ring-emerald-500';
                          else if (isChosen && !isAnswerCorrect) style = 'bg-rose-950/60 border-rose-500 text-rose-100 ring-1 ring-rose-500';
                          else style = 'opacity-40 bg-stone-900 border-stone-850 text-stone-500';
                        }

                        return (
                          <button
                            key={idx}
                            disabled={hasRevealedAnswer}
                            onClick={() => handleSelectOption(idx)}
                            className={`p-4 rounded-xl border text-left flex items-start gap-3 transition-all ${style}`}
                          >
                            <span className="w-6 h-6 rounded-lg bg-stone-800 border border-stone-700 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">
                              {String.fromCharCode(65 + idx)}
                            </span>
                            <span className="text-sm font-medium leading-relaxed">{opt}</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* Erklärung nach Klick */}
                    {hasRevealedAnswer && (
                      <div className="p-4 rounded-xl bg-stone-950 border border-stone-800 space-y-3">
                        <div className="text-xs font-bold flex items-center gap-2">
                          {isCorrect ? (
                            <span className="text-emerald-400">✓ Richtig beantwortet!</span>
                          ) : (
                            <span className="text-rose-400">✗ Leider nicht korrekt.</span>
                          )}
                        </div>
                        <p className="text-xs sm:text-sm text-stone-300 leading-relaxed">{currentQ.explanation}</p>
                        <div className="pt-2 flex justify-end">
                          <button
                            onClick={handleNextQuestion}
                            className="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs sm:text-sm shadow-md transition-all"
                          >
                            {quizIndex < EXAM_QUESTIONS.length - 1 ? 'Nächste Frage ▶' : 'Zur Ergebnisübersicht ▶'}
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  /* ================= ERGEBNISÜBERSICHT ================= */
                  <div className="bg-stone-900 border border-stone-800 rounded-2xl p-6 sm:p-8 shadow-xl space-y-8 animate-in fade-in">
                    <div className="text-center max-w-lg mx-auto space-y-4">
                      <div className="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mx-auto text-3xl">
                        🎓
                      </div>
                      <h2 className="font-serif text-3xl font-bold text-stone-100">Ergebnisübersicht deines Selbsttests</h2>
                      <p className="text-xs text-stone-400">Klausur: Europäische Musikgeschichte (Hochschulniveau)</p>

                      <div className="p-6 rounded-2xl bg-stone-950 border border-stone-800 flex items-center justify-around">
                        <div>
                          <div className="text-3xl font-serif font-bold text-amber-300">{score} / {EXAM_QUESTIONS.length}</div>
                          <div className="text-xs text-stone-400">Punkte</div>
                        </div>
                        <div className="h-10 w-px bg-stone-800" />
                        <div>
                          <div className="text-3xl font-serif font-bold text-stone-100">{percentage}%</div>
                          <div className="text-xs text-stone-400">Erreicht</div>
                        </div>
                        <div className="h-10 w-px bg-stone-800" />
                        <div>
                          <div className="text-sm font-bold text-emerald-400">
                            {percentage >= 85 ? 'Summa cum laude' : percentage >= 70 ? 'Sehr gut' : percentage >= 50 ? 'Bestanden' : 'Wiederholungsbedarf'}
                          </div>
                          <div className="text-xs text-stone-400">Klausururteil</div>
                        </div>
                      </div>

                      <button
                        onClick={handleResetQuiz}
                        className="px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-sm shadow-lg transition-all"
                      >
                        Quiz wiederholen
                      </button>
                    </div>

                    {/* Frage-für-Frage-Auswertung */}
                    <div className="pt-6 border-t border-stone-800 space-y-3">
                      <h4 className="font-serif text-lg font-bold text-stone-200">Detaillierte Analyse aller Aufgaben:</h4>
                      {EXAM_QUESTIONS.map((q, idx) => {
                        const userChoice = selectedAnswers[q.id];
                        const qSuccess = userChoice === q.correctIndex;
                        return (
                          <div key={q.id} className={`p-4 rounded-xl border ${qSuccess ? 'bg-stone-950 border-stone-800' : 'bg-rose-950/20 border-rose-900/40'}`}>
                            <div className="font-serif text-sm font-bold text-stone-200">
                              {idx + 1}. {q.question} {qSuccess ? '✅' : '❌'}
                            </div>
                            <div className="text-xs text-stone-400 mt-1">
                              Deine Antwort: <span className={qSuccess ? 'text-emerald-300 font-bold' : 'text-rose-300 font-bold'}>{q.options[userChoice] || 'Keine'}</span>
                            </div>
                            {!qSuccess && (
                              <div className="text-xs text-emerald-400 mt-0.5">
                                Richtige Lösung: <span className="font-bold">{q.options[q.correctIndex]}</span>
                              </div>
                            )}
                            <p className="text-xs text-stone-300 mt-2 leading-relaxed">{q.explanation}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-stone-800 bg-stone-900/80 py-6 text-xs text-stone-400 mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-serif font-bold text-stone-200">MusicaEuropa</span>
                <span>·</span>
                <span>Europäische Musikgeschichte für Studierende</span>
              </div>
              <div>Web Audio API Synthese · Eigenständige HTML-Datei</div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
